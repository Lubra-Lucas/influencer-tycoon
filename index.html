<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1238" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Influencer Tycoon</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #2a1238; --panel: #3d1b52; --line: #ff7eb6; --text: #fff4fb;
      --muted: #c9a3d9; --gold: #ffd36e; --ok: #7dffb3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 10px/1.6 'Press Start 2P', monospace;
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    /* painel do personagem: retrato + numeros; no celular a barra fica embaixo */
    #hud { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; margin: 8px 8px 0;
           padding: 8px; background: var(--panel); border: 3px solid #000; }
    #hud img { grid-row: 1; width: 64px; height: 64px; image-rendering: pixelated; display: block; }
    #hud b { color: var(--line); }
    #followers { font-size: 18px; color: var(--gold); text-shadow: 3px 3px 0 #000; word-break: break-all; margin-top: 4px; }
    #rates { color: var(--muted); margin-top: 4px; font-size: 8px; }
    #title { display: inline-block; margin-top: 4px; padding: 2px 6px; border: 2px solid var(--line); color: var(--line); font-size: 8px; }
    #goal { grid-column: 1 / -1; position: relative; height: 22px; border: 3px solid #000; background: var(--bg); overflow: hidden; }
    #goal span { position: relative; z-index: 1; display: block; text-align: center; font-size: 8px; line-height: 16px;
                 text-shadow: 2px 2px 0 #000; white-space: nowrap; }
    #goal i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #b3306a; }

    main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #play { display: flex; flex-direction: column; }
    /* o mapa tem a proporcao do canvas: o canvas se ajusta em escala inteira, sem faixa vazia */
    #stage { position: relative; aspect-ratio: 192 / 160; max-height: 55vh; margin: 8px auto 0; width: 100%; display: grid; place-items: center; overflow: hidden; }
    #star { background: none; border: 0; padding: 0; cursor: pointer; display: block; line-height: 0; }
    #star:focus-visible { outline: 3px dashed var(--gold); outline-offset: 3px; }
    canvas { image-rendering: pixelated; display: block; border: 3px solid #000; }
    #hint { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; color: var(--text);
            text-shadow: 2px 2px 0 #000; margin: 0; pointer-events: none; }

    .pop { position: absolute; pointer-events: none; color: var(--text); text-shadow: 2px 2px 0 #000;
           animation: up 0.9s ease-out forwards; }
    .pop.viral { color: var(--gold); font-size: 14px; }
    .pop.auto { color: var(--ok); font-size: 10px; animation-duration: 1.2s; }
    @keyframes up { to { transform: translateY(-80px); opacity: 0; } }

    #shop { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 16px; -webkit-overflow-scrolling: touch; }
    #shop h2 { font-size: 10px; color: var(--line); margin: 14px 4px 8px; }
    .item {
      width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; text-align: left;
      background: var(--panel); color: var(--text); font: inherit;
      border: 3px solid #000; box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.12);
      padding: 10px; margin-bottom: 8px; cursor: pointer;
    }
    .item:disabled { opacity: 0.45; cursor: default; }
    @media (hover: hover) { .item:not(:disabled):hover { border-color: var(--line); } }
    .item:not(:disabled):active { transform: translateY(2px); }
    .item small { grid-column: 1; color: var(--muted); font-size: 8px; }
    .item .count { color: var(--gold); text-align: right; }
    .item .price { color: var(--ok); text-align: right; font-size: 8px; }

    #toast {
      position: fixed; left: 50%; top: 20%; transform: translateX(-50%); width: min(90vw, 360px);
      background: var(--panel); border: 3px solid var(--line); padding: 14px; text-align: center; z-index: 2;
    }
    #toast button { margin-top: 10px; font: inherit; background: var(--line); color: #000; border: 3px solid #000; padding: 8px 12px; }

    /* computador: painel e mapa a esquerda, loja a direita */
    @media (min-width: 820px) {
      body { font-size: 12px; }
      main { flex-direction: row; max-width: 1280px; width: 100%; margin: 0 auto; gap: 16px; padding: 16px; }
      #play { flex: 1; min-width: 0; }
      #hud { margin: 0; gap: 8px 16px; }
      #hud img { grid-row: 1 / span 2; width: 128px; height: 128px; }
      #goal { grid-column: 2; }
      #followers { font-size: 22px; }
      #rates, #title { font-size: 10px; }
      #stage { flex: 1; aspect-ratio: auto; max-height: none; margin-top: 16px; place-items: start center; }
      #shop { flex: 0 0 400px; padding: 0 4px 0 0; }
    }
  </style>
</head>
<body>
  <main>
    <div id="play">
      <header id="hud">
        <img src="art/retrato.png" alt="Retrato da blogueira" />
        <div>
          <b>@blogueira</b><br />
          <span id="title"></span>
          <div id="followers">0</div>
          <div id="rates"></div>
        </div>
        <div id="goal"><span></span><i></i></div>
      </header>
      <section id="stage">
        <button id="star" aria-label="Postar: ganhar seguidores"><canvas></canvas></button>
        <p id="hint">toque pra postar</p>
      </section>
    </div>
    <section id="shop" aria-label="Loja"></section>
  </main>
  <div id="toast" hidden><p id="toast-text"></p><button type="button">Arrasou</button></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
